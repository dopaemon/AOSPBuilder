env:
    CIRRUS_CLONE_DEPTH: 1
    BUILD_HOSTNAME: "CirrusCI"
    DEBIAN_FRONTEND: "noninteractive"
    PD_API_KEY: ENCRYPTED[e2514e31c9b433faf99d8e6a2451b60ebff406073578f707eb93ef58ce809f27998cb149ba88d4a089b9d8d943ddca12]
    SF_PASSWORD: ENCRYPTED[134c9f2823c604c8aae1c1f5ec7b34d7773665677a0d36c41883026c6b703f5362b2d92eebeb550c9a2707fbe337d721]

task:
  name: Enviroment
  skip: $CIRRUS_BRANCH != 'InfinityX-A16'
  alias: Enviroment
  persistent_worker:
  timeout_in: 24h

  script:
    - echo "Starting setup environment..."

  check_script:
    - echo $(nproc --all)
    - echo $(free -mh)
    - echo $(df -h)

  enviroment_script:
    - rm -rf /home/kernelpanix/out/InfinityX
    - mkdir -p /home/kernelpanix/out/InfinityX
    - rm -rf /home/kernelpanix/InfinityX/out/.lock
    - cd /home/kernelpanix/out/InfinityX
    - wget https://github.com/ling-zhou/rust-sshpass/releases/download/1.1.5/sshpass-1.1.5-x86_64-linux.tar.xz
    - tar -xvf sshpass-1.1.5-x86_64-linux.tar.xz
    - wget https://github.com/ManuelReschke/go-pd/releases/download/v1.5.0/go-pd_1.5.0_linux_amd64.tar.gz
    - tar -xvf go-pd_1.5.0_linux_amd64.tar.gz

task:
  name: Xiaomi 12
  skip: $CIRRUS_BRANCH != 'InfinityX-A16'
  alias: CupidBuild
  depends_on: Enviroment
  persistent_worker:
  timeout_in: 24h
  cupid_script:
    - DEVICE="cupid"
    - cd /home/kernelpanix/InfinityX
    - . build/envsetup.sh > /dev/null 2>&1 || true
    - lunch infinity_$DEVICE-user
    - m bacon -j$(nproc --all) | tee log.txt
    - mv out/target/product/$DEVICE/Proje*$DEVICE*.zip /home/kernelpanix/out/InfinityX/

