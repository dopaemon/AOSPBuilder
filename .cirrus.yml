task:
  name: Upload
  skip: $CIRRUS_BRANCH != 'InfinityX-A16'
  persistent_worker:
  timeout_in: 24h
  depends_on:
    - CupidBuild
    - ZeusBuild
    - MayflyBuild
    - UnicornBuild
    - DitingBuild
    - IngresBuild

  pixeldrain_script:
    - cd /home/kernelpanix/out/InfinityX
    -  ./go-pd upload -k $PD_API_KEY *.zip -v

  sourceforge_script:
    - cd /home/kernelpanix/out/InfinityX
    - ./sshpass -p $SF_PASSWORD rsync -avP ./*.zip dopaemon@frs.sourceforge.net:/home/frs/project/android-unofficial/Android-16/InfinityX
