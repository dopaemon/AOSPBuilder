task:
  name: Upload
  skip: $CIRRUS_BRANCH != 'LunarisAOSP-A16'
  persistent_worker:
  timeout_in: 24h
  depends_on:
    - CupidBuild
    - ZeusBuild
    - MayflyBuild
    - UnicornBuild
    - DitingBuild
    - IngresBuild

  pixeldrain_script:
    - cd $CIRRUS_OUT_DIR/
    -  ./go-pd upload -k $PD_API_KEY *.zip -v || ./go-pd upload -k $PD_API_KEY *.zip -v

  sourceforge_script:
    - cd $CIRRUS_OUT_DIR/
    - ./sshpass -p $SF_PASSWORD rsync -avP ./*.zip dopaemon@frs.sourceforge.net:/home/frs/project/android-unofficial/Android-16/Lunaris || ./sshpass -p $SF_PASSWORD rsync -avP ./*.zip dopaemon@frs.sourceforge.net:/home/frs/project/android-unofficial/Android-16/Lunaris
